name: New source
description: Propose a source for the pipeline (needs Research sign-off)
labels: ["source", "needs-research-review"]
body:
  - type: input
    id: name
    attributes:
      label: Source name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Feed or data URL
    validations:
      required: true
  - type: checkboxes
    id: topics
    attributes:
      label: Topics it covers
      options:
        - label: Stablecoins
        - label: Tokenization and real-world assets
        - label: Regulation and market structure
        - label: Bitcoin as an institutional asset
        - label: AI and crypto
        - label: Prediction markets
  - type: textarea
    id: why
    attributes:
      label: Why Research should trust it
    validations:
      required: true
